<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <style>
      .title { font: 700 40px Georgia, serif; fill: #252c30; }
      .subtitle { font: 15px Arial, sans-serif; fill: #555d60; letter-spacing: 2px; }
      .wall { fill: none; stroke: #42494c; stroke-width: 15; stroke-linejoin: round; }
      .district { stroke: #777b79; stroke-width: 2; }
      .label { font: 700 22px Georgia, serif; fill: #293137; }
      .small { font: 15px Arial, sans-serif; fill: #343d41; }
      .road { fill: none; stroke: #fbf7e9; stroke-width: 10; }
      .road-edge { fill: none; stroke: #6e5c49; stroke-width: 14; opacity: .7; }
      .river { fill: #9cc9d8; stroke: #4a8499; stroke-width: 4; }
      .bridge { fill: #75695b; stroke: #3d4549; stroke-width: 4; }
      .landmark { fill: #f9f6e9; stroke: #30383c; stroke-width: 3; }
      .note { font: italic 14px Georgia, serif; fill: #575f62; }
    </style>
    <pattern id="paper" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#f5f3e9"/>
      <path d="M0 13 H26" stroke="#c8c4b5" stroke-width=".5" opacity=".35"/>
    </pattern>
  </defs>

