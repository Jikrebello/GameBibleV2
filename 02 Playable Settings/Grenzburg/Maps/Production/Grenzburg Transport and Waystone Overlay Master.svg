<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <style>
      .title { font: 700 38px Georgia, serif; fill: #17212b; }
      .subtitle { font: 17px Arial, sans-serif; fill: #4b555c; }
      .region { fill: #dce2dd; stroke: #8a9293; stroke-width: 2; }
      .region-label { font: italic 19px Georgia, serif; fill: #697174; }
      .road { fill: none; stroke: #694d37; stroke-width: 8; stroke-linecap: round; }
      .river { fill: none; stroke: #337e9c; stroke-width: 18; stroke-linecap: round; }
      .ferry { fill: none; stroke: #337e9c; stroke-width: 6; stroke-dasharray: 12 8; }
      .sled { fill: none; stroke: #70a9b6; stroke-width: 5; stroke-dasharray: 4 10; }
      .way { fill: none; stroke: #7a3f82; stroke-width: 6; stroke-dasharray: 8 7; }
      .node { fill: #fff; stroke: #26333a; stroke-width: 4; }
      .key { fill: #7a3f82; stroke: #fff; stroke-width: 2; }
      .label { font: 700 16px Arial, sans-serif; fill: #202b32; }
      .id { font: 700 13px Arial, sans-serif; fill: #7a3f82; }
      .legend { font: 15px Arial, sans-serif; fill: #29343a; }
      .note { font: italic 14px Georgia, serif; fill: #4d575c; }
    </style>
  </defs>
  <rect width="1800" height="1200" fill="#e9ede8"/>
  <rect x="38" y="36" width="1724" height="1128" fill="#f7f8f3" stroke="#27323a" stroke-width="4"/>
  <text x="82" y="92" class="title">Grenzburg Transport and Road-Key Overlay</text>
  <text x="84" y="124" class="subtitle">Physical services and seven fixed neighboring Menhir links - no arbitrary fast travel</text>

