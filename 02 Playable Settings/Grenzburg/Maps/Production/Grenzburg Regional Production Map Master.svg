      .region { stroke: #4e5961; stroke-width: 3; }
      .region-label { font: 700 23px Georgia, serif; fill: #18242b; }
      .id { font: 700 14px Arial, sans-serif; fill: #344049; }
      .place { font: 700 17px Arial, sans-serif; fill: #18242b; }
      .minor { font: 14px Arial, sans-serif; fill: #344049; }
      .road { fill: none; stroke: #694d37; stroke-width: 6; stroke-linecap: round; }
      .minor-road { fill: none; stroke: #806a55; stroke-width: 3; stroke-dasharray: 10 8; }
      .river { fill: none; stroke: #337e9c; stroke-width: 16; stroke-linecap: round; }
