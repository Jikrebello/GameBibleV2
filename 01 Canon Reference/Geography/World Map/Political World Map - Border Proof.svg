      <polygon id="A2-Al-Qahur" class="province" fill="#e1c959" fill-opacity="0.22" points="608,326 653,342 699,328 746,342 799,382 833,424 821,474 772,503 709,493 651,465 606,426 588,374"/>
      <polygon id="A3-Qazmarid" class="province" fill="#c9ac34" fill-opacity="0.23" points="219,307 273,298 329,320 371,360 425,382 493,388 558,411 604,452 613,511 580,559 525,582 456,574 399,548 337,536 279,502 241,454 222,395"/>
      <polygon id="A4-Zanthir" class="province" fill="#c9a43f" fill-opacity="0.23" points="812,381 858,368 909,378 951,404 956,444 925,468 875,474 833,455 808,421"/>
      <polygon id="A5-Velian-States" class="province" fill="url(#velian-hatch)" stroke="#8d2638" points="760,451 790,435 825,440 855,460 866,480 840,501 801,501 770,481"/>
      <path class="outer" d="M566 118 L621 99 L674 108 L716 145 L737 205 L731 278 L699 328 L746 342 L799 382 L833 424 L821 474 L772 503 L709 493 L651 465 L606 426 L588 374 L575 285 L557 222 Z"/>
